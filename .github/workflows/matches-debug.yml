name: Matches debug (temporary)
on:
  push:
    branches: [claude/server-hosts-manual-apps-vgx26g]
    paths: [".github/workflows/matches-debug.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe sources
        run: |
          python3 - <<'PY'
          import urllib.request, json
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone.utc); d0 = now.strftime('%Y%m%d'); d7 = (now+timedelta(days=7)).strftime('%Y%m%d'); day = now.strftime('%Y-%m-%d')
          UA = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'}
          tests = [(c, f'https://site.api.espn.com/apis/site/v2/sports/soccer/{c}/scoreboard?dates={d0}', UA) for c in
                   ['egy.1','egypt.1','egy.premier','ksa.1','esp.1','ita.1','ger.1','fra.1','uefa.europa','caf.champions','caf.nations','fifa.worldq.caf','fifa.friendly','uefa.nations']]
          tests += [
            ('sdb season egy 2026-2027', 'https://www.thesportsdb.com/api/v1/json/3/eventsseason.php?id=4829&s=2026-2027', UA),
            ('sdb season egy 2026', 'https://www.thesportsdb.com/api/v1/json/3/eventsseason.php?id=4829&s=2026', UA),
            ('sdb past+next egy rounds', 'https://www.thesportsdb.com/api/v1/json/3/eventsround.php?id=4829&r=8&s=2026-2027', UA),
            ('sdb lookup leagues egypt', 'https://www.thesportsdb.com/api/v1/json/3/search_all_leagues.php?c=Egypt&s=Soccer', UA),
            ('sdb lookup leagues saudi', 'https://www.thesportsdb.com/api/v1/json/3/search_all_leagues.php?c=Saudi-Arabia&s=Soccer', UA),
            ('fd ucl', f'https://fixturedownload.com/feed/json/champions-league-2026', UA),
          ]
          for name, url, h in tests:
            try:
              with urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=20) as r:
                b = r.read()
                print('OK ', name, r.status, len(b))
                try:
                  j = json.loads(b)
                  if isinstance(j, dict):
                    if j.get('countries') or j.get('countrys'):
                      for L_ in (j.get('countries') or j.get('countrys'))[:10]: print('    league', L_.get('idLeague'), L_.get('strLeague'))
                    ev = j.get('events') or []
                    print('    keys', list(j)[:8], 'events', len(ev))
                    for e in ev[:6]:
                      print('    ', e.get('date') or e.get('strTimestamp'), e.get('name') or e.get('strEvent'), '|', e.get('strLeague',''))
                    if 'leagues' in j: print('    calendar', str(j['leagues'][0].get('calendar', ''))[:200])
                  else:
                    print('    list', len(j), json.dumps(j[:2])[:300])
                except Exception as x:
                  print('    not json', b[:200])
            except Exception as e:
              body = ''
              try: body = e.read()[:200]
              except Exception: pass
              print('ERR', name, e, body)
          PY
