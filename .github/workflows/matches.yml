name: Update matches

# Refreshes assets/data/matches.json (big football matches for the next 7 days, with the exact channel from FilGoal / Kooora) and assets/data/standings.json (league tables),
# plus assets/data/bot.json (match channels from the admin bot) and assets/data/ramadan.json (Ramadan series from Wikipedia), then rebuilds the site so the big-match pages (en/ar/match/…) appear and disappear on their own.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '_source/matches/**'
      - '.github/workflows/matches.yml'

permissions:
  contents: write

concurrency:
  group: matches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch matches
        run: python3 _source/matches/fetch_matches.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # Hossam's ntfy topic: a phone alert when a match source fails twice in a row
      - name: Fetch basketball (NBA, EuroLeague, FIBA)
        run: cd _source/matches && python3 fetch_basketball.py
        continue-on-error: true
      - name: Fetch league tables
        run: cd _source/matches && python3 fetch_standings.py
        continue-on-error: true
      - name: Fetch match channels (set from the admin bot)
        run: cd _source/matches && python3 fetch_site.py
        continue-on-error: true
      - name: Fetch Ramadan series (elCinema + Wikipedia) — once a day (the first run after midnight UTC)
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%H)" -lt 6 ]; then
            cd _source/matches && python3 fetch_ramadan.py
          else
            echo "Ramadan series: updated once a day — skipped this run"
          fi
        continue-on-error: true
      - name: Rebuild the site (big-match pages come and go with the data)
        run: python3 _source/build.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets/data en ar sitemap.xml)" ]; then
            git config user.name "matches-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A assets/data en ar sitemap.xml
            git commit -m "Update matches"
            git pull --rebase origin main
            git push
          fi
