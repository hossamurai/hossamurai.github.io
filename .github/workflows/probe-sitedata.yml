name: probe-sitedata
on:
  push:
    branches: [claude/server-hosts-manual-apps-vgx26g]
    paths: ['.github/workflows/probe-sitedata.yml']
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -m 30 -D - https://n8n.hossamservices.com/webhook/site-data -o body.json | head -20
          python3 -c "
          import json; d=json.load(open('body.json')); print('keys', list(d.keys())); print('uptime', d.get('uptime')); print('speedtests', json.dumps(d.get('speedtests'))[:800])"
          curl -sS -m 30 -o /dev/null -w "speed OPTIONS %{http_code}\n" -X OPTIONS -H "Origin: https://hossamservices.com" -H "Access-Control-Request-Method: POST" https://n8n.hossamservices.com/webhook/site-speed
          curl -sS -m 30 -w "\nspeed GET %{http_code}\n" https://n8n.hossamservices.com/webhook/site-speed | head -c 300
