name: Probe (temporary)
on:
  push:
    branches: [claude/server-hosts-manual-apps-vgx26g]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          for u in "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard" "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/scoreboard"; do
            echo "== $u"; curl -s -D - -o /tmp/b.json -H "Origin: https://hossamservices.com" "$u" | grep -i "^HTTP\|access-control\|cache-control\|content-type"
          done
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/b.json'))
          for e in d.get('events', [])[:3]:
              c = e['competitions'][0]
              print(e['name'], e['status']['type'], e['status'].get('displayClock'))
              print('  scores', [(t['team']['displayName'], t.get('score')) for t in c['competitors']])
              print('  details', json.dumps(c.get('details', [])[:2])[:600])
          PY
