name: Probe (temporary)
on:
  push:
    branches: [claude/server-hosts-manual-apps-vgx26g]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, json, time
          UA={'User-Agent':'Mozilla/5.0'}
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=20) as r: return json.loads(r.read())
          for lid,name in [(4328,'EPL'),(4480,'UCL'),(4335,'LaLiga'),(4668,'Saudi'),(4829,'Egypt'),(4332,'SerieA')]:
              try:
                  ev=get(f'https://www.thesportsdb.com/api/v1/json/3/eventsnextleague.php?id={lid}')['events'][0]
                  tv=get(f"https://www.thesportsdb.com/api/v1/json/3/lookuptv.php?id={ev['idEvent']}").get('tvevent') or []
                  print(name, ev['strEvent'], 'channels:', len(tv))
                  print('   countries:', sorted({t.get('strCountry') for t in tv}))
                  for t in tv:
                      if t.get('strCountry') in ('Egypt','Saudi Arabia','Qatar','United Arab Emirates','Kuwait','Algeria','Morocco','Jordan','Iraq','Lebanon','Tunisia','Libya','Oman','Bahrain','Canada','United States','Middle East','MENA','Arab World','Worldwide','International'):
                          print('     ', t.get('strCountry'), '->', t.get('strChannel'))
              except Exception as e: print(name,'err',e)
              time.sleep(2)
          PY
