name: probe
on:
  push:
    branches: [claude/server-hosts-manual-apps-vgx26g]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd _source/matches && python3 fetch_basketball.py && cd ../..
          python3 -c "
          import json;d=json.load(open('assets/data/basketball.json'))
          from collections import Counter;print(Counter(e['code'] for e in d['events']))
          for e in d['events'][:6]+[e for e in d['events'] if e['code']!='nba'][:8]: print(e['utc'],e['code'],e['home']['en'],'v',e['away']['en'], bool(e['home']['logo']))
          for r in d['results'][:5]: print('R',r['league']['en'],r['home']['en'],r['hs'],'-',r['as'],r['away']['en'])"
          base64 -w0 assets/data/basketball.json | cat > /tmp/b64; echo; echo B64START; cat /tmp/b64; echo; echo B64END
