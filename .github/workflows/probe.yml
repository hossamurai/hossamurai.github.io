name: Probe (temporary)
on:
  push:
    branches: [claude/server-hosts-manual-apps-vgx26g]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          ID=$(python3 -c "import json;d=json.load(open('/dev/stdin'));print([e['id'][1:] for e in d['events'] if e['id'].startswith('s')][0])" < <(curl -s https://raw.githubusercontent.com/hossamurai/hossamurai.github.io/main/assets/data/matches.json))
          echo "event $ID"
          curl -s -D - -o /tmp/e.json -H "Origin: https://hossamservices.com" "https://www.thesportsdb.com/api/v1/json/3/lookupevent.php?id=$ID" | grep -i "^HTTP\|access-control\|cache"
          python3 -c "import json;e=json.load(open('/tmp/e.json'))['events'][0];print({k:e.get(k) for k in ['strEvent','strTimestamp','strStatus','strProgress','intHomeScore','intAwayScore','strPostponed','dateEvent','strTime']})"
          curl -s -D - -o /dev/null -H "Origin: https://hossamservices.com" "https://www.thesportsdb.com/api/v1/json/3/eventsnextleague.php?id=4829" | grep -i "access-control"
