name: probe
on:
  push:
    branches: [claude/server-hosts-manual-apps-vgx26g]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 _source/matches/fetch_matches.py
          cat assets/data/sources.json
          python3 -c "
          import json;d=json.load(open('assets/data/matches.json'))
          for e in d['events']:
            if e['code'] in ('xtra','lbn.1','egy.1'): print(e['utc'],e['code'],e['home']['en'],'v',e['away']['en'])"
