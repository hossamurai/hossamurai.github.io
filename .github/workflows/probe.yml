name: probe
on:
  push:
    branches: [claude/server-hosts-manual-apps-vgx26g]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -f assets/data/matches.json
          python3 _source/matches/fetch_matches.py
          python3 - <<'PY'
          import json
          d=json.load(open('assets/data/matches.json'))
          print('events', len(d['events']))
          for e in d['events']:
            print(e['utc'], e['code'], '|', e['league']['ar'], '|', e['home']['en'], '/', e['home']['ar'], 'v', e['away']['en'], '/', e['away']['ar'], '| top' if e['top'] else '', (e.get('channel') or {}).get('en',''))
          print('results')
          for r in d['results']: print(r['utc'], r['league']['en'], r['home']['en'], r['hs'], '-', r['as'], r['away']['en'])
          PY
          cd _source/matches && python3 fetch_standings.py
